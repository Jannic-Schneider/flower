<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Who needs flowers when you can code them? ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Funkelnder Sternenhintergrund */
    .space-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    header {
      text-align: center;
      z-index: 2;
      margin-top: 1rem;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: normal;
      color: #fff5f7;
      text-shadow: 0 0 10px rgba(255, 182, 193, 0.4);
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.75rem;
      color: #f472b6;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 3/4;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
      margin: 0.5rem 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 15px rgba(244, 63, 94, 0.2));
    }

    /* Interaktive Nachrichtenkarten */
    .note-card {
      width: 100%;
      max-width: 400px;
      min-height: 80px;
      background: rgba(10, 10, 12, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px dashed rgba(244, 63, 94, 0.4);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.1);
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .note-text {
      font-size: 0.95rem;
      line-height: 1.4;
      color: #fda4af;
      text-shadow: 0 0 4px rgba(253, 164, 175, 0.3);
      transition: opacity 0.25s ease;
    }

    .note-counter {
      margin-top: 0.5rem;
      font-size: 0.65rem;
      color: #9d174d;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <div class="space-bg" id="spaceBg"></div>

  <header>
    <h1 id="titleText">Who needs flowers when you can code them?</h1>
    <p class="subtitle" id="subtitleText">Tap on the Lily bouquet</p>
  </header>

  <div class="canvas-container">
    <canvas id="lilyCanvas"></canvas>
  </div>

  <div class="note-card" id="noteCard">
    <p class="note-text" id="noteText">A bouquet of digital lilies that will bloom forever. 🌌</p>
    <span class="note-counter" id="noteCounter">Tap on a blossom to explore the code...</span>
  </div>
